services:
  flowiq:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowiq:latest
    container_name: flowiq
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    env_file:
      - ./env/flowiq.traefik.env
    environment:
      - NODE_ENV=production
      - DISABLE_HMR=true
    volumes:
      - ./prisma:/app/prisma
    networks:
      - traefik_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3001/api/v1/dashboard",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flowiq.rule=Host(`flowiq.ailevate.com.au`)"
      - "traefik.http.routers.flowiq.entrypoints=websecure"
      - "traefik.http.routers.flowiq.tls=true"
      - "traefik.http.routers.flowiq.tls.certresolver=letsencrypt"
      - "traefik.http.services.flowiq.loadbalancer.server.port=3001"
      - "traefik.docker.network=traefik_network"

networks:
  traefik_network:
    external: true
